[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galaxy-erp-api"
version = "0.1.0"
description = "Galaxy ERP - API y CLI Multi-tenant para Venezuela"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "typer>=0.12.5",
    "rich>=13.9.2",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "structlog>=24.4.0",
    "openpyxl>=3.1.5",
    "weasyprint>=62.3",
    "arq>=0.26.0",
    "apscheduler>=3.10.4",
]

[project.scripts]
erpctl = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "testcontainers[postgres]>=4.8.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "core.*",
    "app.modules.inventario.*",
    "app.modules.ventas.*",
    "app.modules.bancos.*",
]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
